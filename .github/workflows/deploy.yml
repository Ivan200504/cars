name: Deploy static site to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload website to hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get latest code
        uses: actions/checkout@v6

      - name: Normalize FTP target directory
        id: ftp-dir
        run: |
          dir="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$dir" ]; then
            dir="/"
          fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Sync files to hosting with lftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_SERVER_DIR: ${{ steps.ftp-dir.outputs.server_dir }}
        run: |
          lftp -e "
            set cmd:fail-exit true
            set ssl:verify-certificate no
            set ftp:ssl-force true
            set ftp:ssl-protect-data true
            set ftp:passive-mode true
            set ftp:prefer-epsv false
            set net:timeout 120
            set net:max-retries 2
            set net:reconnect-interval-base 5
            open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" -p \"$FTP_PORT\" \"$FTP_SERVER\"
            mkdir -p \"$FTP_SERVER_DIR\"
            mirror -R --delete --verbose \
              --exclude-glob .git* \
              --exclude-glob .github \
              --exclude-glob .github/** \
              --exclude-glob .DS_Store \
              --exclude-glob design-qa.md \
              ./ \"$FTP_SERVER_DIR\"
            bye
          "
