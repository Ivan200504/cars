name: Deploy static site to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    name: Upload website to hosting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Get latest code
        uses: actions/checkout@v6

      - name: Normalize FTP target directory
        id: ftp-dir
        run: |
          dir="${{ secrets.FTP_SERVER_DIR }}"
          if [ -z "$dir" ]; then
            dir="/"
          fi
          case "$dir" in
            */) ;;
            *) dir="${dir}/" ;;
          esac
          echo "server_dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Sync files to FTP hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ steps.ftp-dir.outputs.server_dir }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.DS_Store
            design-qa.md
